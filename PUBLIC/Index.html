<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Registration Form</h1>
        <p>Enter your details below</p>

        <form id="registrationForm">

            <!-- Name -->
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <!-- Age -->
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Enter your age">

            <!-- Email -->
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <!-- Roll Number -->
            <label for="rollNo">Roll Number</label>
            <input type="text" id="rollNo" placeholder="Enter your roll number">

            <!-- Course -->
            <label for="course">Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="BSc">B.Sc</option>
                <option value="BCom">B.Com</option>
                <option value="BE">B.E</option>
                <option value="BTech">B.Tech</option>
            </select>

            <!-- Branch -->
            <label for="branch">Branch</label>
            <select id="branch">
                <option value="">Select Branch</option>
                <option value="CSE">Computer Science</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil</option>
            </select>

            <!-- Gender -->
            <label>Gender</label>

            <div class="gender">
                <label>
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label>
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>
            </div>

            <!-- Address -->
            <label for="address">Address</label>
            <textarea id="address" placeholder="Enter your address"></textarea>

            <!-- Buttons -->
            <button type="submit">Register</button>
            <button type="reset" class="reset">Clear</button>

        </form>

        <div id="message"></div>

    </div>

<!-- SUCCESS POPUP -->

<div id="successPopup" class="popup-overlay">

    <div class="popup">

        <div class="success-icon">✓</div>

        <h2>Registration Successful!</h2>

        <p>
            Student details have been submitted successfully.
        </p>

        <button type="button" id="closePopup">
            OK
        </button>

    </div>

</div>


<script src="script.js"></script>
</body>
</html>
